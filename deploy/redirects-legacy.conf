# veystunesofficial.de -> dj-veys.de — per-path 301 map.
#
# Included at nginx's `http {}` level (see nginx/nginx.conf) and consumed by
# the legacy-domain server block as `return 301
# https://dj-veys.de$legacy_redirect$is_args$args;`. Preserving link equity is
# the entire point of this migration (CHECKLIST.md A.4 calls the domain
# migration "en yüksek teknik risk" — the highest technical risk in the
# project) — a blanket "everything -> /" redirect throws that away, so every
# path below maps to its nearest real equivalent on the new site, not the
# homepage.
#
# New-site paths come straight from src/i18n/routing.ts `pathnames` (German
# is the default locale, unprefixed — "/" root). Old-site paths are the six
# known from the brief (README/CLAUDE context); this list is deliberately
# NOT exhaustive of the entire old site — anything not listed here falls
# through to the default "/" rule rather than 404ing, so no incoming link
# ever dead-ends, but every path the client actually told us about gets a
# precise match. If server logs on the old domain surface more real
# historical paths after launch (see docs/DEPLOYMENT.md go-live checklist —
# check Search Console's "Adressänderung"/coverage report and the nginx
# access log on the legacy-domain server block for 301-hit paths that landed
# on the default), add them here rather than leaving them on the catch-all.
#
# Both trailing-slash and no-trailing-slash forms are mapped defensively —
# unknown which form was actually indexed/linked.

map $uri $legacy_redirect {
  default '/';

  '/'                              '/';

  # "Über uns" -> EPK (bio/press-kit page; closest real equivalent — the
  # site has no separate freestanding "about" page, see src/app/[locale]/epk).
  '/ueber-uns/'                    '/epk';
  '/ueber-uns'                     '/epk';

  '/kontakt/'                      '/kontakt';
  '/kontakt'                       '/kontakt';

  # Blog index (old site's single "Hochzeitstipps" blog page -> new
  # Ratgeber/guide index; individual old posts aren't known here, so they
  # land on the index rather than a random guide article).
  '/blog-hochzeitstipps/'          '/ratgeber';
  '/blog-hochzeitstipps'           '/ratgeber';

  '/impressum/'                    '/impressum';
  '/impressum'                     '/impressum';

  '/datenschutzerklaerung/'        '/datenschutz';
  '/datenschutzerklaerung'         '/datenschutz';
}
