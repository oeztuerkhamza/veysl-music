# www.praxis-gueltekin.de — static site (Astro build), served from disk.
#
# A second, unrelated tenant on this box: no proxy_pass, no app container,
# just files under /srv/sites/praxis-gueltekin. Lives in its own file so that
# nginx.conf stays the dj-veys config; the only line it gained is the
# `include` that picks this directory up.
#
# ORDERING: the 443 block below is commented out until the certificate
# exists. nginx treats a missing `ssl_certificate` file as fatal for the
# WHOLE config, not just that server block — adding it early would take
# dj-veys.de down with it. Sequence: deploy this file HTTP-only, repoint DNS,
# issue the cert, then uncomment and reload. The same reasoning is spelled
# out at the dj-veys.de server block in nginx.conf.

# Cache policy by path. A `map` keeps this to a single add_header at server
# level: an add_header inside a location would drop every inherited one, so
# the security headers would silently vanish for exactly the assets that are
# requested most.
map $uri $praxis_cache {
  default                                   "public, max-age=0, must-revalidate";
  # The admin panel's config is regenerated with every content publish.
  ~^/admin                                  "no-store";
  ~^/_astro/                                "public, max-age=31536000, immutable";
  ~*\.(?:webp|avif|png|jpe?g|svg|ico|woff2?)$ "public, max-age=31536000, immutable";
}

server {
  listen 80;
  listen [::]:80;
  server_name praxis-gueltekin.de www.praxis-gueltekin.de;

  # Takes precedence over the regex location below (^~), so a challenge token
  # is never mistaken for a trailing-slash redirect.
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://www.praxis-gueltekin.de$request_uri;
  }
}

# --- TLS (certificate: /etc/letsencrypt/live/praxis-gueltekin.de) -----------

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name praxis-gueltekin.de;

  ssl_certificate     /etc/letsencrypt/live/praxis-gueltekin.de/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/praxis-gueltekin.de/privkey.pem;
  include /etc/nginx/ssl-params.conf;

  # The site's canonical host is www; every canonical tag and sitemap entry
  # says so.
  return 301 https://www.praxis-gueltekin.de$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.praxis-gueltekin.de;

  ssl_certificate     /etc/letsencrypt/live/praxis-gueltekin.de/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/praxis-gueltekin.de/privkey.pem;
  include /etc/nginx/ssl-params.conf;

  root /srv/sites/praxis-gueltekin;
  index index.html;
  error_page 404 /404.html;

  add_header Cache-Control $praxis_cache always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # GitHub login for the admin panel (/admin, Decap CMS). The bridge runs in
  # its own container (tools/praxis-cms). Resolved per request through
  # Docker's DNS instead of at startup: a plain `proxy_pass
  # http://praxis-cms-oauth:8787` would make nginx refuse to start — taking
  # dj-veys.de down with it — whenever that container is missing. This way a
  # missing bridge is a 502 on /oauth/ and nothing else.
  # `^~` so the trailing-slash regex below never sees these requests. No
  # add_header in here: it would drop the security headers above.
  location ^~ /oauth/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $praxis_cms_oauth http://praxis-cms-oauth:8787;
    proxy_pass $praxis_cms_oauth;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  location ~ ^(.+)/$ {
    return 301 $1$is_args$args;
  }

  location / {
    try_files $uri $uri/index.html =404;
  }
}