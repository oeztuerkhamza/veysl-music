# dj-veys.de — reverse proxy + TLS termination.
#
# One app domain (dj-veys.de) fronting a single Next.js container that serves
# the marketing site, the Payload admin panel (/admin) and all API routes —
# unlike a split admin-SPA/API/homepage setup, there is nothing else to
# route: everything not caught by the legacy-domain redirect below goes to
# `app:3000`.
#
# Security headers: X-Content-Type-Options, Referrer-Policy,
# Permissions-Policy and Strict-Transport-Security are already set by the
# app itself (next.config.ts `headers()`) on every response, so they are
# deliberately NOT repeated here — setting them twice would either silently
# duplicate the header (harmless but sloppy) or, if nginx's value ever drifts
# from next.config.ts's, actively contradict it. `add_header` on an
# upstream-proxied response only appends to what's already sent, so simply
# not adding here is enough to avoid both problems. X-Frame-Options is added
# here because the app does not set it.
#
# A repo-wide, tested Content-Security-Policy is intentionally NOT included —
# this site's WebGL hero, GSAP, wavesurfer.js, Payload's Lexical admin editor
# and the Spotify/SoundCloud/YouTube facades all load their own scripts/
# frames, and a guessed CSP is more likely to silently break one of those
# than to add real protection. See docs/DEPLOYMENT.md "Known issues /
# follow-ups" for how to build one safely (report-only first).

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" "$http_x_forwarded_for"';
  access_log /var/log/nginx/access.log main;
  error_log /var/log/nginx/error.log warn;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  server_tokens off;

  # --- Echte Client-IP hinter einem CDN -----------------------------------
  #
  # Diese eine auskommentierte Zeile ist die Bedingung dafür, dass die Domain
  # überhaupt hinter ein CDN (Cloudflare) gestellt werden darf. Ohne sie ist
  # der Umzug kein Performance-Gewinn, sondern ein Ausfall des
  # Anfrageformulars — und zwar ein leiser.
  #
  # Der Grund: An `$remote_addr` hängen auf dieser Site **zwei** Zähler, nicht
  # einer.
  #
  #   1. Die `limit_req`-Zonen weiter unten. Ihre Schlüssel sind
  #      `$binary_remote_addr` (siehe die `map`-Blöcke), Rate 10/Minute für
  #      `/api/anfrage`, `/api/kontakt`, `/api/whatsapp-lead`.
  #   2. Der Token-Bucket in der Anwendung selbst
  #      (`src/app/api/_lib/rate-limit.ts`). Er liest `X-Real-IP` — und das
  #      setzt diese Datei ein paar Zeilen weiter unten aus `$remote_addr`.
  #
  # Hinter einem CDN ist `$remote_addr` nicht mehr die Besucherin, sondern der
  # Cloudflare-Knoten, über den sie hereinkommt. Beide Zähler fallen damit auf
  # **ein gemeinsames Konto pro Rechenzentrum** zusammen: Nach etwa zehn
  # Anfragen aus ganz Stuttgart bekommt die nächste echte Brautmutter einen
  # 429. Nichts daran sieht nach einem Fehler aus — kein Log-Eintrag der Art
  # „falsch konfiguriert", nur ein Formular, das manchmal nicht abschickt.
  #
  # `cloudflare-ips.conf` stellt die echte Adresse wieder her und repariert
  # damit beide Zähler auf einen Schlag, weil der zweite ohnehin am ersten
  # hängt.
  #
  # ⚠️ Bewusst noch NICHT aktiv. Der Header `CF-Connecting-IP` ist genau so
  # weit vertrauenswürdig, wie sichergestellt ist, dass Anfragen aus
  # Cloudflares Netz auch wirklich über Cloudflare kommen. Solange die Domain
  # direkt auf den VPS zeigt, ist das nicht sichergestellt: Wer aus jenem Netz
  # heraus den Ursprungsserver direkt anspricht, dürfte sich seine Kennung
  # dann selbst aussuchen und beide Limits umgehen — bei einem Formular, das
  # per SMTP von der eigenen Domain versendet, ist das der Weg auf
  # Spam-Blocklisten (siehe den Kopf von `src/app/api/_lib/rate-limit.ts`).
  #
  # Deshalb gehört das Einkommentieren in denselben Arbeitsschritt wie die
  # DNS-Umstellung und die Firewall-Regel auf dem Ursprungsserver. Die drei
  # Schritte in der richtigen Reihenfolge stehen in docs/DEPLOYMENT.md
  # („CDN vorschalten").
  #
  # include /etc/nginx/cloudflare-ips.conf;

  # --- Compression --------------------------------------------------------
  # gzip only — nginx:alpine has no ngx_brotli module built in. Brotli would
  # need a custom nginx image (compiled with ngx_brotli); not worth the extra
  # maintenance surface for the first production cut. gzip alone covers the
  # large majority of the win for HTML/CSS/JS/JSON responses. If the upstream
  # (Next.js, which has its own `compress: true` default) has already
  # gzip-encoded a response, nginx passes it through unchanged rather than
  # double-compressing.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/xml+rss
    application/rss+xml
    application/manifest+json
    image/svg+xml
    font/ttf
    font/otf
    font/woff
    font/woff2;

  # Large enough for wedding photo uploads through Payload's /admin media
  # library (DSLR JPEGs commonly run 8-15MB) with headroom; raise if the
  # owner ever uploads bulk RAW/video. Applies proxy-wide — the only inbound
  # uploads this app accepts are through /admin.
  client_max_body_size 25M;

  # --- Rate limiting -------------------------------------------------------
  # Keyed on $binary_remote_addr — the TCP peer address, which a client cannot
  # forge. The application has its own limiter, but it can only ever see
  # headers; this zone is the layer that holds even if a header is trusted by
  # mistake, and it is also the only thing in front of Payload's own REST
  # endpoints, which the app-level limiter does not wrap at all.
  #
  # `/api/users/login` matters specifically: Payload locks a user document
  # after 5 failed attempts (users.ts `maxLoginAttempts`). With no limit in
  # front, an attacker keeps the owner's only admin account permanently locked
  # for the price of one request every two minutes. The lockout is the right
  # control; it just must not be reachable at machine speed.
  # The zones used to be keyed on $binary_remote_addr directly, and no
  # `limit_req` directive referenced them anywhere in this file. A
  # `limit_req_zone` on its own allocates shared memory and enforces nothing:
  # the comment above described a protective layer that was not switched on,
  # and every endpoint it names was unmetered at the edge.
  #
  # Turning it on has one awkward constraint. `limit_req` belongs in the
  # `location` that should be limited, but every request here is served by a
  # single `location /` proxying to Next.js, and putting the form limit there
  # would cap ordinary page views at 10 requests a minute. Splitting out a
  # `location` per endpoint means duplicating the whole proxy_set_header block
  # for each, which then drifts.
  #
  # So the *key* decides instead of the location. nginx does not account a
  # request whose key evaluates to an empty string, so a zone keyed through
  # these maps applies only to the paths the map matches, and a single
  # `limit_req` pair down in `location /` covers everything without touching
  # normal traffic.
  #
  # Matched on $uri, not $request_uri: $uri is decoded and normalised, so
  # `/api/%61nfrage` and `/api//anfrage` cannot slip past the pattern.
  map $uri $form_limit_key {
    default              '';
    ~^/api/anfrage       $binary_remote_addr;
    ~^/api/kontakt       $binary_remote_addr;
    ~^/api/whatsapp-lead $binary_remote_addr;
  }

  map $uri $login_limit_key {
    default              '';
    ~^/api/users/login   $binary_remote_addr;
  }

  limit_req_zone $form_limit_key zone=forms:10m rate=10r/m;
  limit_req_zone $login_limit_key zone=login:10m rate=10r/m;
  limit_req_status 429;

  # Deliberately NOT limited here:
  #   - Payload's other REST endpoints. The admin panel makes many calls per
  #     page, so a 10r/m cap would break /admin. Login is the one that needs
  #     it, for the lockout reason above.
  #   - /api/health/mail. Its own in-process limiter is 10 per *ten* minutes,
  #     which is stricter than anything sensible here, and a token-gated
  #     endpoint that CI polls should not also be throttled at the edge.

  # --- Upstream ------------------------------------------------------------
  upstream veysl_app {
    server app:3000;
    keepalive 32;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # Legacy-domain path map — see deploy/redirects-legacy.conf.
  include /etc/nginx/redirects-legacy.conf;

  # --- ACME challenge (shared by both domains, plain HTTP) -----------------
  server {
    listen 80;
    listen [::]:80;
    server_name dj-veys.de www.dj-veys.de veystunesofficial.de www.veystunesofficial.de;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # --- www.dj-veys.de -> apex (301, preserve path) ---------------------------
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.dj-veys.de;

    # Same certificate as every other block below — see the note on the
    # main dj-veys.de server block for why this is one SAN cert, not four.
    ssl_certificate /etc/letsencrypt/live/dj-veys.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dj-veys.de/privkey.pem;
    include /etc/nginx/ssl-params.conf;

    return 301 https://dj-veys.de$request_uri;
  }

  # --- mta-sts.dj-veys.de — MTA-STS policy only ----------------------------
  # RFC 8461 requires the policy at exactly
  # https://mta-sts.<domain>/.well-known/mta-sts.txt, on its own subdomain and
  # over valid TLS. Publishing the _mta-sts TXT record without serving this
  # file is worse than not publishing it: sending servers fetch it, fail, and
  # some log the domain as misconfigured.
  #
  # Everything else on this host 404s. It exists to serve one text file, and
  # a policy host that also answers for the app is an easy way to end up with
  # the site reachable under a name its canonical tags do not know about.
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mta-sts.dj-veys.de;

    ssl_certificate /etc/letsencrypt/live/dj-veys.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dj-veys.de/privkey.pem;
    include /etc/nginx/ssl-params.conf;

    location = /.well-known/mta-sts.txt {
      proxy_pass http://veysl_app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      default_type text/plain;
    }

    location / {
      return 404;
    }
  }

  # --- Legacy domain (both host forms) -> per-path 301 to dj-veys.de --------
  # See deploy/redirects-legacy.conf for the exact path map and why this is
  # the single biggest SEO-risk item in the migration.
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name veystunesofficial.de www.veystunesofficial.de;

    ssl_certificate /etc/letsencrypt/live/dj-veys.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dj-veys.de/privkey.pem;
    include /etc/nginx/ssl-params.conf;

    location / {
      return 301 https://dj-veys.de$legacy_redirect$is_args$args;
    }
  }

  # --- dj-veys.de — the app -------------------------------------------------
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dj-veys.de;

    # One certificate, four hostnames as SANs (dj-veys.de, www.dj-veys.de,
    # veystunesofficial.de, www.veystunesofficial.de) — see
    # deploy/setup-ssl.sh. Deliberately a single `certbot certonly` call
    # instead of two separate per-domain certs: with two certs, nginx
    # refuses to start at all until BOTH live directories exist (a hard
    # `ssl_certificate` file-not-found is fatal for the whole config, not
    # just that server block), which would block launching dj-veys.de on
    # whether the legacy domain's DNS happens to be repointed yet. One SAN
    # cert removes that ordering dependency.
    ssl_certificate /etc/letsencrypt/live/dj-veys.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dj-veys.de/privkey.pem;
    include /etc/nginx/ssl-params.conf;

    # Long, immutable cache for content-hashed build assets.
    location /_next/static/ {
      proxy_pass http://veysl_app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      add_header Cache-Control 'public, max-age=31536000, immutable' always;
    }

    # Everything else: pages, /admin, /api/*, sitemap.xml, robots.txt — all
    # served by the same Next.js app, no separate routing needed.
    location / {
      # Both zones are keyed through the maps at the top of this file, which
      # yield an empty key — and therefore no accounting at all — for anything
      # that is not a form submission or an admin login. These two lines are a
      # no-op for page views, and the only thing standing in front of the
      # enquiry funnel and Payload's login for everyone else.
      #
      # burst allows a genuine double-submit or a retyped password through;
      # nodelay lets that burst be served immediately rather than queued, so a
      # legitimate visitor never waits on the limiter.
      limit_req zone=forms burst=5 nodelay;
      limit_req zone=login burst=3 nodelay;

      proxy_pass http://veysl_app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;

      # Generous but bounded — sharp resizing three image sizes on a media
      # upload, or a slow admin bulk edit, both need more than nginx's 60s
      # default without being unbounded.
      proxy_connect_timeout 60s;
      proxy_send_timeout 120s;
      proxy_read_timeout 120s;

      add_header X-Frame-Options SAMEORIGIN always;
    }
  }
}
