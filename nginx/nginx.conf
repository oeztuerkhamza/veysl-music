# veysl.de — reverse proxy + TLS termination.
#
# One app domain (veysl.de) fronting a single Next.js container that serves
# the marketing site, the Payload admin panel (/admin) and all API routes —
# unlike a split admin-SPA/API/homepage setup, there is nothing else to
# route: everything not caught by the legacy-domain redirect below goes to
# `app:3000`.
#
# Security headers: X-Content-Type-Options, Referrer-Policy,
# Permissions-Policy and Strict-Transport-Security are already set by the
# app itself (next.config.ts `headers()`) on every response, so they are
# deliberately NOT repeated here — setting them twice would either silently
# duplicate the header (harmless but sloppy) or, if nginx's value ever drifts
# from next.config.ts's, actively contradict it. `add_header` on an
# upstream-proxied response only appends to what's already sent, so simply
# not adding here is enough to avoid both problems. X-Frame-Options is added
# here because the app does not set it.
#
# A repo-wide, tested Content-Security-Policy is intentionally NOT included —
# this site's WebGL hero, GSAP, wavesurfer.js, Payload's Lexical admin editor
# and the Spotify/SoundCloud/YouTube facades all load their own scripts/
# frames, and a guessed CSP is more likely to silently break one of those
# than to add real protection. See docs/DEPLOYMENT.md "Known issues /
# follow-ups" for how to build one safely (report-only first).

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" "$http_x_forwarded_for"';
  access_log /var/log/nginx/access.log main;
  error_log /var/log/nginx/error.log warn;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  server_tokens off;

  # --- Compression --------------------------------------------------------
  # gzip only — nginx:alpine has no ngx_brotli module built in. Brotli would
  # need a custom nginx image (compiled with ngx_brotli); not worth the extra
  # maintenance surface for the first production cut. gzip alone covers the
  # large majority of the win for HTML/CSS/JS/JSON responses. If the upstream
  # (Next.js, which has its own `compress: true` default) has already
  # gzip-encoded a response, nginx passes it through unchanged rather than
  # double-compressing.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/xml+rss
    application/rss+xml
    application/manifest+json
    image/svg+xml
    font/ttf
    font/otf
    font/woff
    font/woff2;

  # Large enough for wedding photo uploads through Payload's /admin media
  # library (DSLR JPEGs commonly run 8-15MB) with headroom; raise if the
  # owner ever uploads bulk RAW/video. Applies proxy-wide — the only inbound
  # uploads this app accepts are through /admin.
  client_max_body_size 25M;

  # --- Upstream ------------------------------------------------------------
  upstream veysl_app {
    server app:3000;
    keepalive 32;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # Legacy-domain path map — see deploy/redirects-legacy.conf.
  include /etc/nginx/redirects-legacy.conf;

  # --- ACME challenge (shared by both domains, plain HTTP) -----------------
  server {
    listen 80;
    listen [::]:80;
    server_name veysl.de www.veysl.de veystunesofficial.de www.veystunesofficial.de;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # --- www.veysl.de -> apex (301, preserve path) ---------------------------
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.veysl.de;

    # Same certificate as every other block below — see the note on the
    # main veysl.de server block for why this is one SAN cert, not four.
    ssl_certificate /etc/letsencrypt/live/veysl.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/veysl.de/privkey.pem;
    include /etc/nginx/ssl-params.conf;

    return 301 https://veysl.de$request_uri;
  }

  # --- Legacy domain (both host forms) -> per-path 301 to veysl.de --------
  # See deploy/redirects-legacy.conf for the exact path map and why this is
  # the single biggest SEO-risk item in the migration.
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name veystunesofficial.de www.veystunesofficial.de;

    ssl_certificate /etc/letsencrypt/live/veysl.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/veysl.de/privkey.pem;
    include /etc/nginx/ssl-params.conf;

    location / {
      return 301 https://veysl.de$legacy_redirect$is_args$args;
    }
  }

  # --- veysl.de — the app -------------------------------------------------
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name veysl.de;

    # One certificate, four hostnames as SANs (veysl.de, www.veysl.de,
    # veystunesofficial.de, www.veystunesofficial.de) — see
    # deploy/setup-ssl.sh. Deliberately a single `certbot certonly` call
    # instead of two separate per-domain certs: with two certs, nginx
    # refuses to start at all until BOTH live directories exist (a hard
    # `ssl_certificate` file-not-found is fatal for the whole config, not
    # just that server block), which would block launching veysl.de on
    # whether the legacy domain's DNS happens to be repointed yet. One SAN
    # cert removes that ordering dependency.
    ssl_certificate /etc/letsencrypt/live/veysl.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/veysl.de/privkey.pem;
    include /etc/nginx/ssl-params.conf;

    # Long, immutable cache for content-hashed build assets.
    location /_next/static/ {
      proxy_pass http://veysl_app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      add_header Cache-Control 'public, max-age=31536000, immutable' always;
    }

    # Everything else: pages, /admin, /api/*, sitemap.xml, robots.txt — all
    # served by the same Next.js app, no separate routing needed.
    location / {
      proxy_pass http://veysl_app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;

      # Generous but bounded — sharp resizing three image sizes on a media
      # upload, or a slow admin bulk edit, both need more than nginx's 60s
      # default without being unbounded.
      proxy_connect_timeout 60s;
      proxy_send_timeout 120s;
      proxy_read_timeout 120s;

      add_header X-Frame-Options SAMEORIGIN always;
    }
  }
}
