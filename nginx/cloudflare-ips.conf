# Cloudflare-Edge-Adressen — die einzigen Absender, denen `CF-Connecting-IP`
# geglaubt werden darf.
#
# Diese Datei wird von `nginx.conf` eingebunden, sobald die Domain hinter
# Cloudflare steht. Die ausführliche Begründung — warum ohne sie das
# Anfrageformular für echte Kundinnen und Kunden mit 429 antwortet — steht dort
# am `include`; hier steht nur, was die Liste ist und wie sie aktuell bleibt.
#
# ── Auffrischen ─────────────────────────────────────────────────────────────
#
# Cloudflare ändert diese Bereiche selten, aber es kommt vor. Der Stand unten
# ist der vom 2026-08-10, direkt von der Quelle geholt. Neu erzeugen:
#
#   { curl -fsS https://www.cloudflare.com/ips-v4; echo; \
#     curl -fsS https://www.cloudflare.com/ips-v6; } \
#   | sed 's/^/set_real_ip_from /; s/$/;/'
#
# Danach `docker compose exec nginx nginx -t && docker compose exec nginx nginx -s reload`.
#
# Ein veralteter Eintrag ist nicht harmlos: Für eine Anfrage aus einem Bereich,
# der hier fehlt, bleibt `$remote_addr` die Cloudflare-Adresse — und genau dann
# teilen sich wieder alle Besucher aus diesem Rechenzentrum ein Limit-Konto.

# IPv4 — https://www.cloudflare.com/ips-v4
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# IPv6 — https://www.cloudflare.com/ips-v6
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# Cloudflare setzt diesen Header selbst und überschreibt dabei, was der Client
# mitgeschickt hat. Er ist deshalb vertrauenswürdig — aber ausschließlich für
# Verbindungen aus den Bereichen oben, und `real_ip_header` gilt in nginx
# genau so: Kommt eine Anfrage von irgendeiner anderen Adresse, wird der Header
# ignoriert und `$remote_addr` bleibt der echte TCP-Absender.
real_ip_header CF-Connecting-IP;
