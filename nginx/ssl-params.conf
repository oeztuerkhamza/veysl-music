# Shared TLS settings, included by every `server { listen 443 ssl; }` block
# in nginx.conf. Deliberately does NOT set Strict-Transport-Security here —
# the app already sends it (next.config.ts `headers()`, max-age=2 years,
# includeSubDomains, preload) and duplicating it here risks the two values
# drifting apart. See the note at the top of nginx.conf.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# OCSP stapling — speeds up the client's cert-validity check. Harmless no-op
# if the resolver can't reach the OCSP responder (e.g. transient DNS issue).
ssl_stapling on;
ssl_stapling_verify on;
resolver 1.1.1.1 8.8.8.8 valid=300s;
resolver_timeout 5s;
