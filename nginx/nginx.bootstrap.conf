# One-time bootstrap config, used ONLY before the first TLS certificate
# exists. `nginx.conf`'s `server { listen 443 ssl; }` blocks reference
# `/etc/letsencrypt/live/dj-veys.de/fullchain.pem`, and nginx refuses to start
# at all if a referenced cert file is missing — but certbot's webroot method
# needs nginx already serving `/.well-known/acme-challenge/` on port 80 to
# obtain that cert in the first place. This file breaks that chicken-and-egg
# loop: HTTP-only, ACME challenge + a plain proxy to the app so the site
# isn't dark while waiting on the one-time cert issuance.
#
# deploy/setup-ssl.sh swaps this in, runs certbot, then swaps nginx.conf
# back in and reloads. Not needed again after the first successful run —
# renewals (deploy/deploy.sh via the `certbot` container's own renew loop)
# reuse the existing cert and never touch nginx's listening config.

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log warn;
  sendfile on;
  server_tokens off;

  upstream veysl_app {
    server app:3000;
  }

  server {
    listen 80;
    listen [::]:80;
    server_name dj-veys.de www.dj-veys.de veystunesofficial.de www.veystunesofficial.de;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      proxy_pass http://veysl_app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
