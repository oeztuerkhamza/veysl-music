name: Deploy the Kleinanzeigen watcher

# Bringt tools/kleinanzeigen-watcher auf den Server und startet den Container
# neu. Eigener Workflow statt eines Schritts in "Build, verify, deploy" — aus
# demselben Grund wie beim Mail-Stack: der Watcher hat einen anderen
# Lebenszyklus als die Website und darf sie bei einem Fehlschlag nicht
# mitreissen. Umgekehrt soll ein Website-Deploy den Watcher nicht neu starten.
#
# Der Bot-Token kommt aus dem Secret WATCHER_TELEGRAM_BOT_TOKEN und wird bei
# jedem Lauf frisch in die .env auf dem Server geschrieben. Er steht damit an
# genau einer Stelle — im Secret-Store — und nicht in einer von Hand
# gepflegten Datei, die bei einem Serverwechsel vergessen wird.
#
# Was der Deploy NICHT anfasst: data/. Dort liegen die Suchen und das
# Gedaechtnis, welche Anzeigen schon gemeldet wurden.

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'tools/kleinanzeigen-watcher/**'
      - '.github/workflows/deploy-watcher.yml'
      - '.github/scripts/deploy-watcher-apply.sh'

permissions:
  contents: read

concurrency:
  group: deploy-watcher
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
          BOT_TOKEN: ${{ secrets.WATCHER_TELEGRAM_BOT_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${SSH_HOST:-}" ] || [ -z "${SSH_USER:-}" ] || [ -z "${SSH_KEY:-}" ]; then
            echo "::error::DEPLOY_SSH_HOST / DEPLOY_SSH_USER / DEPLOY_SSH_KEY are not set — see docs/DEPLOYMENT.md."
            exit 1
          fi
          # Ohne Token startet der Container zwar, kann aber nichts senden.
          # Das hier abzufangen ist billiger, als es aus einem Crash-Loop auf
          # dem Server zurueckzuverfolgen.
          if [ -z "${BOT_TOKEN:-}" ]; then
            echo "::error::WATCHER_TELEGRAM_BOT_TOKEN ist nicht gesetzt. Anlegen mit: gh secret set WATCHER_TELEGRAM_BOT_TOKEN"
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/watcher_key
          chmod 600 ~/.ssh/watcher_key
          if [ -n "${SSH_HOST_KEY:-}" ]; then
            printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_SSH_HOST_KEY is not set — accepting the host key on first sight."
            ssh-keyscan -t rsa,ecdsa,ed25519 "$SSH_HOST" >> ~/.ssh/known_hosts || {
              echo "::error::ssh-keyscan could not reach $SSH_HOST."
              exit 1
            }
          fi

          SSH_OPTS="-i $HOME/.ssh/watcher_key -o BatchMode=yes -o ConnectTimeout=20"

          # Nur der Code, ohne data/ und ohne .env — beide leben auf dem
          # Server und duerfen von einem Deploy nicht ueberschrieben werden.
          tar -czf watcher-src.tgz -C tools/kleinanzeigen-watcher \
            Dockerfile docker-compose.yml watcher.mjs src README.md \
            watches.example.json .env.example

          # Der Token geht als Datei ueber scp, nicht als Argument: alles in
          # einer SSH-Kommandozeile steht auf dem Server in der Prozessliste
          # und waere dort fuer jeden sichtbar, der `ps` aufruft.
          umask 077
          printf 'TELEGRAM_BOT_TOKEN=%s\n' "$BOT_TOKEN" > watcher.env

          set -o pipefail
          scp $SSH_OPTS watcher-src.tgz "$SSH_USER@$SSH_HOST:/tmp/watcher-src.tgz"
          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" 'mkdir -p /opt/veysl/kleinanzeigen-watcher'
          scp $SSH_OPTS watcher.env "$SSH_USER@$SSH_HOST:/opt/veysl/kleinanzeigen-watcher/.env"
          rm -f watcher.env

          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" \
            'chmod 600 /opt/veysl/kleinanzeigen-watcher/.env && bash -s' \
            < .github/scripts/deploy-watcher-apply.sh 2>&1 | tee apply.txt
          status=${PIPESTATUS[0]}

          {
            echo "### Watcher deploy"
            echo
            echo '```'
            cat apply.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$status" -ne 0 ]; then
            echo "::error::Der Deploy ist fehlgeschlagen — siehe Ausgabe oben."
            exit 1
          fi

          # Ein gruener Lauf, nach dem kein Container laeuft, waere die
          # schlechteste Rueckmeldung von allen: man verlaesst sich auf
          # Alarme, die nie kommen.
          if grep -q 'RESULT: RUNNING' apply.txt; then
            echo "::notice::Der Watcher laeuft."
          else
            echo "::error::Deploy gelaufen, aber der Container laeuft nicht."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watcher-deploy
          path: apply.txt
          retention-days: 14
          if-no-files-found: ignore
